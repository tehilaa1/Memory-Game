<!DOCTYPE html>
<html>
    <head>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <meta charset="UTF-8">
</head>
<body>
<style>
  body {
    font-family: Arial;
    text-align: center;
    background: #cbdbfa;
  }

  #game {
    display: grid;
    grid-template-columns: repeat(3, 80px);
    gap: 10px;
    justify-content: center;
    margin-top: 20px;
  }

  button {
    width: 80px;
    height: 80px;
    font-size: 24px;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    background: rgb(130, 185, 183);
    box-shadow: 0 2px 6px rgba(189, 196, 227, 0.2);
    transition: 0.2s;
  }
   .mute-btn {
   position: absolute;
   top: 10px;
   right: 10px;

   width: 100px;
   height: 40px;
   font-size: 14px;

   border-radius: 8px;
 }

  button:hover {
    transform: scale(1.05);
  }

  button:disabled {
    background: #62899e;
    cursor: default;
  }
</style>
<h1>Memory Game</h1>

<div id="game"></div>

<script src="app.js"></script>

</body>
</html>
